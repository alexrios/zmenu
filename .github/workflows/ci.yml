name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
