name: CI

on:
  push:
  pull_request:

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Savannah intermittently returns 502/504 for this transitive dependency.
      - name: Fetch FreeType from its release mirror
        shell: bash
        run: |
          hash=$(zig fetch https://downloads.sourceforge.net/project/freetype/freetype2/2.14.3/freetype-2.14.3.tar.xz)
          test "$hash" = "N-V-__8AAJo-LAHFNfa0p0oMQqmwlBEAZMOeo03azXgrKLTT"
      - name: Build ReleaseSafe
        run: zig build -Doptimize=ReleaseSafe
      - name: Test
        run: zig build test
