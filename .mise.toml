[tools]
zig = "0.16.0"

[tasks.build]
description = "Build the project"
run = "zig build"

[tasks.run]
description = "Run the application"
run = "zig build run"

[tasks.test]
description = "Run unit tests"
run = "zig build test"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf zig-cache zig-out"

[tasks.check]
description = "Check code without building"
run = "zig build --summary all"

[tasks."build:release-fast"]
description = "Build optimized release (ReleaseFast)"
run = "zig build -Doptimize=ReleaseFast"

[tasks."build:release-small"]
description = "Build optimized release (ReleaseSmall)"
run = "zig build -Doptimize=ReleaseSmall"

[tasks."build:release-safe"]
run = "zig build -Doptimize=ReleaseSafe"

[tasks.benchmark]
description = "ReleaseSafe internal large-list timings and peak RSS (SDL offscreen)"
run = "zig build benchmark -Doptimize=ReleaseSafe && python3 benchmarks/run.py"

[tasks."test:ui"]
description = "Exercise real confirmation dispatch with SDL offscreen"
run = "zig build benchmark -Doptimize=ReleaseSafe && python3 benchmarks/check_ui.py"
